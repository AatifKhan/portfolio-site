<svg width="1200" height="700" viewBox="0 0 1200 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="600" y1="24" x2="600" y2="454" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7E5C8"/>
      <stop offset="0.32" stop-color="#ECD7CF"/>
      <stop offset="0.65" stop-color="#D1DCE2"/>
      <stop offset="1" stop-color="#90A6B7"/>
    </linearGradient>
    <linearGradient id="water" x1="600" y1="430" x2="600" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7F96AB"/>
      <stop offset="0.48" stop-color="#5D7388"/>
      <stop offset="1" stop-color="#223244"/>
    </linearGradient>
    <radialGradient id="sun" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(484 204) rotate(9) scale(344 220)">
      <stop stop-color="#FFF4D6"/>
      <stop offset="0.42" stop-color="#FFE7C0" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#FFE7C0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fog" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(880 308) rotate(170) scale(440 182)">
      <stop stop-color="#F6F1EC" stop-opacity="0.86"/>
      <stop offset="0.54" stop-color="#F6F1EC" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#F6F1EC" stop-opacity="0"/>
    </radialGradient>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="2" seed="8" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono">
        <feFuncA type="table" tableValues="0 0.05"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="mono" mode="soft-light"/>
    </filter>
  </defs>

  <g filter="url(#paper)">
    <rect width="1200" height="700" fill="url(#sky)"/>
    <ellipse cx="482" cy="205" rx="344" ry="220" fill="url(#sun)"/>
    <rect y="432" width="1200" height="268" fill="url(#water)"/>

    <g opacity="0.34" filter="url(#soften)">
      <path d="M-22 472C120 444 218 430 332 432C470 434 598 456 718 466C858 478 992 466 1228 410V700H-22V472Z" fill="#D8E0E4"/>
      <path d="M-10 520C88 488 222 484 350 506C448 522 522 546 628 556C762 570 934 556 1218 514V700H-10V520Z" fill="#C7D6DD"/>
    </g>

    <path d="M-24 500C154 456 310 444 488 458C620 468 754 490 928 492C1032 494 1124 478 1224 454V700H-24V500Z" fill="#C9D7DF" opacity="0.28"/>
    <ellipse cx="886" cy="307" rx="438" ry="182" fill="url(#fog)"/>
  </g>
</svg>
